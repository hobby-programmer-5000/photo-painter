<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Painter</title>
<meta name="color-scheme" content="light dark">
<style>
/* Fonts: Figtree and JetBrains Mono, SIL Open Font License 1.1 (see CREDITS.md). */
@font-face{font-family:"Figtree";font-weight:300 900;font-style:normal;font-display:block;
  src:url(__FONT_FIGTREE__) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;font-style:normal;font-display:block;
  src:url(__FONT_MONO__) format("woff2")}

:root{
  --bar:#f3f1ec; --row:#eae6df; --desk:#e4e0d9; --paper:#f4f1ec; --card:#f6f4ef;
  --line:#d6d1c8; --text:#1f1b18; --muted:#544e48; --dim:#645e57; --faint:#a39d95;
  --chip:#ffffff; --wine:#6f2a2c; --wine-ink:#6f2a2c; --blush:#f0d9d6; --on-wine:#ffffff;
  --shadow:0 1px 2px rgba(40,30,20,.10),0 8px 24px rgba(40,30,20,.10);
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bar:#211e1c; --row:#292523; --desk:#171514; --card:#262321;
    --line:#3b3633; --text:#ece7e1; --muted:#bdb6ae; --dim:#9a938b; --faint:#6f6963;
    --chip:#3a3532; --wine:#8c3a3c; --wine-ink:#e3a09f; --blush:#4d2c2d; --on-wine:#ffffff;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--desk);color:var(--text);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--wine-ink);outline-offset:2px}

.appbar{display:flex;align-items:center;gap:12px;height:54px;padding:0 16px;background:var(--bar);border-bottom:1px solid var(--line)}
.logo{width:30px;height:30px;border-radius:8px;background:var(--wine);color:var(--on-wine);display:grid;place-items:center;flex:none}
.logo svg{width:17px;height:17px}
.appbar h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.appbar .sep{width:1px;height:20px;background:var(--line)}
.appbar .doc{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.appbar .grow{flex:1}
.appbar .btn{flex:none}
.btn{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:0 12px;min-height:34px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn:active{transform:translateY(1px)}

.toolrow{display:flex;align-items:center;gap:6px;height:51px;padding:0 16px;background:var(--row);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:thin}
.chip-brush{background:var(--blush);color:var(--wine-ink);font-weight:600;border-radius:7px;padding:5px 12px;flex:none}
.toolrow .sep{width:1px;height:20px;background:var(--line);margin:0 8px;flex:none}
.toolrow .label{color:var(--muted);margin-right:6px;flex:none}
.sizes{display:flex;gap:2px;list-style:none;margin:0;padding:0;flex:none}
.sizes li{font:13px var(--mono);color:var(--muted);min-width:34px;text-align:center;padding:5px 6px;border-radius:7px;border:1px solid transparent}
.sizes li.on{background:var(--chip);color:var(--text);border-color:var(--line);font-weight:700}
.color{display:flex;align-items:center;gap:8px;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:4px 12px 4px 5px;flex:none}
.swatch{width:22px;height:22px;border-radius:5px;background:#f4f1ec;border:1px solid rgba(0,0,0,.12)}
.hex{font:13px var(--mono);min-width:8ch}
.hex i{font-style:normal;color:var(--faint);margin-right:6px}

main{display:grid;grid-template-columns:minmax(0,1fr) 232px;gap:24px;padding:18px 16px 24px;align-items:start}
.stage{min-width:0}
.easel{position:relative;width:min(100%,calc((100dvh - 200px) * var(--ar,1)));min-width:160px;aspect-ratio:var(--ar,1);box-shadow:var(--shadow);background:var(--paper)}
.easel canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cursor{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:1.5px solid rgba(255,255,255,.95);box-shadow:0 0 0 1px rgba(20,20,20,.55),inset 0 0 0 1px rgba(20,20,20,.55);pointer-events:none;left:0;top:0;will-change:transform}
.cursor::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(20,20,20,.6)}
.cursor[hidden]{display:none}
.drop{position:absolute;inset:0;display:grid;place-items:center;padding:16px;text-align:center}
.drop[hidden]{display:none}
.drop .box{display:grid;gap:12px;justify-items:center;max-width:360px;width:100%;padding:28px 20px;border:2px dashed var(--faint);border-radius:14px;color:#544e48;background:rgba(255,255,255,.35)}
.drop .big{font-size:17px;font-weight:700;color:#1f1b18}
.drop .btn{background:#6f2a2c;border-color:#6f2a2c;color:#fff;font-weight:600;padding:0 18px;min-height:38px}
.drop .small{font-size:12.5px;line-height:1.5}
.drop .err{color:#8a1c1c;font-weight:600;font-size:13px}
.drop .err:empty{display:none}
body.over .easel{outline:3px dashed var(--wine-ink);outline-offset:4px}
.card .ph{display:grid;place-items:center;height:120px;color:var(--dim);font-size:13px;background:var(--desk);padding:0 12px;text-align:center}
.card img[hidden],.card .ph[hidden]{display:none}
.btn:disabled,.seg button:disabled{opacity:.5;cursor:default}
.meta{display:flex;justify-content:space-between;width:min(100%,calc((100dvh - 200px) * var(--ar,1)));min-width:160px;margin-top:8px;font:11.5px var(--mono);color:var(--muted)}

.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card header{display:flex;align-items:center;gap:8px;padding:9px 12px;font-weight:600}
.card header svg{width:15px;height:15px}
.card img{display:block;width:100%;height:auto;max-height:300px;object-fit:contain;background:var(--desk)}
h2{font-size:11.5px;letter-spacing:.14em;font-weight:500;color:var(--muted);margin:8px 0 0;text-transform:uppercase}
.passes{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.passes li{display:flex;align-items:center;gap:10px;color:var(--muted)}
.passes li::before{content:"";width:7px;height:7px;border-radius:50%;border:1px solid var(--dim);flex:none}
.passes li.done{color:var(--dim)}
.passes li.done::before{background:var(--dim);border-color:var(--dim)}
.passes li.on{color:var(--text);font-weight:700}
.passes li.on::before{background:var(--wine-ink);border-color:var(--wine-ink)}
.count{font:12px var(--mono);color:var(--muted)}
.bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--wine-ink)}
.controls{display:flex;flex-wrap:wrap;gap:7px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--chip)}
.seg button{border:0;background:none;min-height:32px;min-width:34px;padding:0 9px;cursor:pointer;font:13px var(--mono);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blush);color:var(--wine-ink);font-weight:700}
.note{color:var(--muted);font-size:13px;margin:4px 0 0}
kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--chip)}

dialog{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--bar);color:var(--text);max-width:min(92vw,560px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(20,15,10,.45)}
dialog h3{margin:0 0 10px;font-size:16px}
dialog img{display:block;max-width:100%;max-height:60vh;margin:0 auto 12px;box-shadow:var(--shadow)}
dialog .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
dialog p{margin:0;color:var(--muted);font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

@media (max-width:760px){
  main{grid-template-columns:1fr;gap:18px}
  .easel,.meta{width:100%}
  .card img{max-height:220px}
}
</style>
</head>
<body>
<header class="appbar">
  <div class="logo" aria-hidden="true">
    <!-- Lucide "brush" icon, ISC License (see CREDITS.md) -->
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m11 10 3 3"/><path d="M6.5 21A3.5 3.5 0 1 0 3 17.5a2.62 2.62 0 0 1-.708 1.792A1 1 0 0 0 3 21z"/><path d="M9.969 17.031 21.378 5.624a1 1 0 0 0-3.002-3.002L6.967 14.031"/></svg>
  </div>
  <h1 data-t="app">Photo Painter</h1><span class="sep" aria-hidden="true"></span><span class="doc" id="doc"></span>
  <span class="grow"></span>
  <button class="btn" id="lang" lang="ko">한국어</button>
  <button class="btn" id="save" data-t="save" data-title="saveTip">Save PNG</button>
</header>

<div class="toolrow" role="group" data-aria="brush">
  <span class="chip-brush" data-t="brush">Brush</span>
  <span class="sep" aria-hidden="true"></span>
  <span class="label" data-t="size">Size</span>
  <ol class="sizes" id="sizes" data-aria="sizes"></ol>
  <span class="sep" aria-hidden="true"></span>
  <span class="label" data-t="color">Color</span>
  <span class="color"><span class="swatch" id="swatch"></span><span class="hex"><i>#</i><span id="hex">f4f1ec</span></span></span>
</div>

<main>
  <section class="stage" data-aria="canvas">
    <div class="easel" id="easel">
      <canvas id="paint" role="img" data-aria="painting"></canvas>
      <canvas id="wet" aria-hidden="true"></canvas>
      <div class="cursor" id="cursor" hidden></div>
      <div class="drop" id="drop">
        <div class="box">
          <span class="big" data-t="dropBig">Drop a photo here</span>
          <button class="btn" id="pick" data-t="pick">Choose a photo</button>
          <span class="small" data-t="dropSmall"></span>
          <span class="err" id="err" role="alert"></span>
        </div>
      </div>
    </div>
    <div class="meta"><span id="dims">840 × 840 px</span><span id="zoom">100%</span></div>
  </section>

  <aside class="side">
    <div class="card">
      <header>
        <!-- Lucide "image" icon, ISC License -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        <span data-t="reference">Reference</span>
      </header>
      <img id="ref" data-alt="refAlt" alt="" hidden>
      <div class="ph" id="refph" data-t="noPhoto"></div>
    </div>
    <h2 data-t="passTitle">Painting pass</h2>
    <ol class="passes" id="passes"></ol>
    <div class="count" id="count" role="status"></div>
    <div class="bar" role="progressbar" data-aria="progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><i id="barfill"></i></div>
    <div class="controls">
      <button class="btn" id="pause" data-title="pauseTip">Pause</button>
      <button class="btn" id="restart" data-t="restart" data-title="restartTip">Restart</button>
    </div>
    <div class="controls">
      <div class="seg" role="group" data-aria="speed">
        <button id="s1" aria-pressed="true" data-title="s1Tip">1×</button>
        <button id="s3" aria-pressed="false" data-title="s3Tip">3×</button>
        <button id="send" data-t="end" data-title="endTip">End</button>
      </div>
      <button class="btn" id="change" data-t="change" data-title="changeTip">Change photo</button>
      <input type="file" id="file" accept="image/*" class="sr" tabindex="-1" aria-hidden="true">
    </div>
    <p class="note" data-t="note"></p>
  </aside>
</main>

<dialog id="sheet" aria-labelledby="sheet-title">
  <h3 id="sheet-title" data-t="saved">Saved picture</h3>
  <img id="sheet-img" data-alt="savedAlt" alt="">
  <div class="row"><p id="sheet-note"></p><button class="btn" id="sheet-close" data-t="close">Close</button></div>
</dialog>

<script>
"use strict";
/* Photo Painter: paints any photo you give it. No photo is bundled and nothing leaves the browser.
   Painterly rendering after Hertzmann (SIGGRAPH 98): layers of opaque strokes, large brush
   to small, each layer correcting where the painting differs most from a blurred photo,
   strokes following the normals of the luminance gradient. Sources are in REFERENCES.md. */

const SIZES  = [126, 69, 38, 21, 12, 7, 4, 3];
const PASSES = ["p1", "p2", "p3", "p4"];                                       // two sizes each, names in TEXT
const DUR    = [5.5, 5.5, 5, 5, 5, 5, 4.5, 4.5];                               // seconds at 1x, 40 in all
const STEPS  = [2, 3, 4, 5, 6, 7, 8, 8];                                       // stroke length in steps
const GRID   = [0.75, 0.75, 0.75, 0.75, 0.75, 0.72, 0.75, 0.67];               // patch = GRID * brush
const BUDGET = [1e9, 1e9, 1e9, 2600, 6200, 10500, 15000, 16500];               // most strokes per size
const TMIN   = [3, 4, 4, 4, 4, 4, 4, 3.5];                                     // least mean error to paint
const WANDER = 3;            // sizes 0..2 wander one step in flat areas, the rest leave a dab
const LONG   = 840, PAPER = "#f4f1ec", SEED = 20261115, TOTAL = DUR.reduce((a, b) => a + b, 0);

const $ = id => document.getElementById(id);

/* ---------- words ---------- */
const TEXT = {
  en: {
    app: "Photo Painter", none: "No photo yet", save: "Save PNG", saveTip: "Save PNG (S)",
    brush: "Brush", size: "Size", sizes: "Brush sizes in pixels", color: "Color",
    canvas: "Canvas", painting: "The painting in progress",
    dropBig: "Drop a photo here", pick: "Choose a photo",
    dropSmall: "You can also paste one with Ctrl+V. The photo stays in this browser and is not uploaded anywhere.",
    badFile: "That file could not be read as an image.",
    reference: "Reference", refAlt: "Reference photo", noPhoto: "Your photo will show here",
    passTitle: "Painting pass", p1: "Block-in", p2: "Form and color", p3: "Refinement", p4: "Fine details",
    strokes: n => n + (n === "1" ? " stroke" : " strokes"), finished: " · finished", progress: "Painting progress",
    pause: "Pause", resume: "Resume", pauseTip: "Pause or resume (Space)", restart: "Restart", restartTip: "Restart (R)",
    speed: "Speed", s1Tip: "Normal speed (1)", s3Tip: "Three times faster (3)", end: "End", endTip: "Finish at once (E)",
    change: "Change photo", changeTip: "Change photo (O)",
    note: "Every dab takes its colour from the photo and lands where the painting is furthest from it. Brushes go from 126 px down to 3.",
    saved: "Saved picture", savedAlt: "The saved painting", close: "Close", still: " · still painting",
    other: "한국어", otherLang: "ko", fileTail: "painting", locale: "en-US"
  },
  ko: {
    app: "사진 그리기", none: "사진 없음", save: "PNG 저장", saveTip: "PNG 저장 (S)",
    brush: "붓", size: "크기", sizes: "붓 크기 (픽셀)", color: "색",
    canvas: "캔버스", painting: "그리고 있는 그림",
    dropBig: "사진을 여기에 끌어다 놓으세요", pick: "사진 고르기",
    dropSmall: "Ctrl+V로 붙여 넣어도 됩니다. 사진은 이 브라우저 안에서만 쓰이고 어디에도 올라가지 않습니다.",
    badFile: "이미지로 읽을 수 없는 파일입니다.",
    reference: "원본 사진", refAlt: "원본 사진", noPhoto: "고른 사진이 여기에 보입니다",
    passTitle: "그리기 단계", p1: "밑칠", p2: "형태와 색", p3: "다듬기", p4: "세부 묘사",
    strokes: n => n + "획", finished: " · 완성", progress: "그리기 진행률",
    pause: "일시정지", resume: "계속", pauseTip: "일시정지 또는 계속 (Space)", restart: "다시 그리기", restartTip: "다시 그리기 (R)",
    speed: "속도", s1Tip: "보통 속도 (1)", s3Tip: "3배 빠르게 (3)", end: "끝", endTip: "바로 완성 (E)",
    change: "사진 바꾸기", changeTip: "사진 바꾸기 (O)",
    note: "붓 자국마다 사진에서 색을 가져와, 그림이 사진과 가장 다른 곳에 놓습니다. 붓은 126 px에서 3 px까지 작아집니다.",
    saved: "저장한 그림", savedAlt: "저장한 그림", close: "닫기", still: " · 그리는 중",
    other: "English", otherLang: "en", fileTail: "painting", locale: "ko-KR"
  }
};
let lang = "en";
try { lang = localStorage.getItem("painter.lang") || ""; } catch (e) { lang = ""; }
if (!TEXT[lang]) lang = /^ko\b/i.test(navigator.language || "") ? "ko" : "en";
const t = k => TEXT[lang][k];
let nf = new Intl.NumberFormat(t("locale"));
const cv = $("paint"), ctx = cv.getContext("2d", {willReadFrequently: true});
const wet = $("wet"), wctx = wet.getContext("2d");
const params = new URLSearchParams(location.search);
const manual = params.has("manual");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches && !manual;

let W = LONG, H = LONG, refR, refG, refB;          // the photo at painting size
let rng, li, layer, T, count, done, running = true, speed = 1;
let curX = 0, curY = 0, curHex = "f4f1ec", wall0 = 0, wallMs = 0;
let timeline = [];                                  // one entry per brush size (kept for recording tools)
let photoName = "", savedNote = null;               // file name without extension; last Save PNG details

function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

/* ---------- image helpers ---------- */
function blurH(s, d, w, h, r) {
  const n = 2 * r + 1;
  for (let y = 0; y < h; y++) {
    const o = y * w; let acc = 0;
    for (let k = -r; k <= r; k++) acc += s[o + Math.min(w - 1, Math.max(0, k))];
    for (let x = 0; x < w; x++) {
      d[o + x] = acc / n;
      const a = x - r, b = x + r + 1;
      acc += s[o + (b < w ? b : w - 1)] - s[o + (a > 0 ? a : 0)];
    }
  }
}
function blurV(s, d, w, h, r) {
  const n = 2 * r + 1;
  for (let x = 0; x < w; x++) {
    let acc = 0;
    for (let k = -r; k <= r; k++) acc += s[x + w * Math.min(h - 1, Math.max(0, k))];
    for (let y = 0; y < h; y++) {
      d[x + y * w] = acc / n;
      const a = y - r, b = y + r + 1;
      acc += s[x + w * (b < h ? b : h - 1)] - s[x + w * (a > 0 ? a : 0)];
    }
  }
}
function blur(src, r) {                             // three box passes, close to a Gaussian
  if (r < 1) return src;
  const a = new Float32Array(src.length), b = new Float32Array(src.length);
  blurH(src, a, W, H, r); blurV(a, b, W, H, r);
  blurH(b, a, W, H, r);   blurV(a, b, W, H, r);
  blurH(b, a, W, H, r);   blurV(a, b, W, H, r);
  return b;
}
const hex2 = v => (v < 16 ? "0" : "") + v.toString(16);

/* ---------- planning one brush size ---------- */
function planLayer(i) {
  const b = SIZES[i], r = Math.round(b * 0.25);
  const R = blur(refR, r), G = blur(refG, r), B = blur(refB, r);
  const L = new Float32Array(W * H);
  for (let p = 0; p < L.length; p++) L[p] = 0.299 * R[p] + 0.587 * G[p] + 0.114 * B[p];
  const snap = ctx.getImageData(0, 0, W, H).data;   // the painting so far
  const D = new Float32Array(W * H);
  for (let p = 0, q = 0; p < D.length; p++, q += 4) {
    const dr = R[p] - snap[q], dg = G[p] - snap[q + 1], db = B[p] - snap[q + 2];
    D[p] = Math.sqrt(dr * dr + dg * dg + db * db);
  }
  // patches: mean error and worst pixel
  const gs = Math.max(2, Math.round(b * GRID[i]));
  let cells = [];
  for (let y0 = 0; y0 < H; y0 += gs) for (let x0 = 0; x0 < W; x0 += gs) {
    const x1 = Math.min(W, x0 + gs), y1 = Math.min(H, y0 + gs);
    let sum = 0, worst = -1, wp = 0;
    for (let y = y0; y < y1; y++) for (let x = x0, p = y * W + x0; x < x1; x++, p++) {
      const d = D[p]; sum += d; if (d > worst) { worst = d; wp = p; }
    }
    const mean = sum / ((x1 - x0) * (y1 - y0));
    if (mean > TMIN[i]) cells.push({mean, wp, k: cells.length});
  }
  if (cells.length > BUDGET[i]) {
    cells.sort((a, c) => c.mean - a.mean || a.k - c.k);
    cells.length = BUDGET[i];
    cells.sort((a, c) => a.k - c.k);
  }
  const dist = (p, cr, cg, cb) => { const dr = R[p] - cr, dg = G[p] - cg, db = B[p] - cb; return Math.sqrt(dr * dr + dg * dg + db * db); };
  const step = Math.max(3, b), flat = Math.max(0.35, 4 / b);
  const strokes = [];
  for (const c of cells) {
    let x = c.wp % W, y = (c.wp - x) / W;
    const cr = Math.round(R[c.wp]), cg = Math.round(G[c.wp]), cb = Math.round(B[c.wp]);
    const pts = [x, y]; let ldx = 0, ldy = 0;
    for (let s = 1; s <= STEPS[i]; s++) {
      const xi = Math.min(W - 2, Math.max(1, Math.round(x))), yi = Math.min(H - 2, Math.max(1, Math.round(y))), p = yi * W + xi;
      const gx = (L[p + 1] - L[p - 1]) / 2, gy = (L[p + W] - L[p - W]) / 2, mag = Math.hypot(gx, gy);
      let dx, dy, last = false;
      if (mag < flat) {                             // flat area
        if (s > 1 || i >= WANDER) break;
        const a = rng() * Math.PI * 2; dx = Math.cos(a); dy = Math.sin(a); last = true;
      } else {
        dx = -gy / mag; dy = gx / mag;              // along the edge
        if (s === 1) { if (rng() < 0.5) { dx = -dx; dy = -dy; } }
        else {
          if (dx * ldx + dy * ldy < 0) { dx = -dx; dy = -dy; }
          dx = 0.7 * dx + 0.3 * ldx; dy = 0.7 * dy + 0.3 * ldy;
          const n = Math.hypot(dx, dy) || 1; dx /= n; dy /= n;
        }
      }
      const nx = x + dx * step, ny = y + dy * step;
      if (nx < 0 || ny < 0 || nx > W - 1 || ny > H - 1) break;
      const q = Math.round(ny) * W + Math.round(nx), q4 = q * 4;
      // stop where the painting is already closer to the photo than this colour would be
      const dPaint = Math.sqrt((R[q] - snap[q4]) ** 2 + (G[q] - snap[q4 + 1]) ** 2 + (B[q] - snap[q4 + 2]) ** 2);
      if (dPaint < dist(q, cr, cg, cb)) break;
      pts.push(nx, ny); x = nx; y = ny; ldx = dx; ldy = dy;
      if (last) break;
    }
    let len = 0; for (let k = 2; k < pts.length; k += 2) len += Math.hypot(pts[k] - pts[k - 2], pts[k + 1] - pts[k - 1]);
    strokes.push({pts, len, hex: hex2(cr) + hex2(cg) + hex2(cb), key: pts[1] / H + (rng() - 0.5) * 0.3});
  }
  strokes.sort((a, c) => a.key - c.key);            // roughly top to bottom, like a hand working down
  // soundtrack events: at most ~45 a second
  const every = Math.max(1, Math.ceil(strokes.length / (DUR[i] * 45))), ev = [];
  for (let k = 0; k < strokes.length; k += every) ev.push([+(k / strokes.length * DUR[i]).toFixed(4), +(strokes[k].pts[0] / W).toFixed(3), +(strokes[k].len / LONG).toFixed(3)]);
  timeline.push({size: b, t0: +T.toFixed(4), dur: DUR[i], strokes: strokes.length, events: ev});
  return {i, b, strokes, n: strokes.length, t: 0, dur: DUR[i], committed: 0, slot: DUR[i] / Math.max(1, strokes.length)};
}

/* ---------- drawing ---------- */
function drawStroke(c, s, b, upto) {                // upto: length to draw, or undefined for all
  const p = s.pts;
  c.strokeStyle = c.fillStyle = "#" + s.hex;
  if (p.length === 2 || upto === 0) { c.beginPath(); c.arc(p[0], p[1], b / 2, 0, Math.PI * 2); c.fill(); return [p[0], p[1]]; }
  c.lineWidth = b; c.lineCap = "round"; c.lineJoin = "round";
  c.beginPath(); c.moveTo(p[0], p[1]);
  let ex = p[0], ey = p[1], left = upto === undefined ? Infinity : upto;
  for (let k = 2; k < p.length; k += 2) {
    const seg = Math.hypot(p[k] - p[k - 2], p[k + 1] - p[k - 1]);
    if (seg <= left) { ex = p[k]; ey = p[k + 1]; left -= seg; c.lineTo(ex, ey); }
    else { const f = left / seg; ex = p[k - 2] + (p[k] - p[k - 2]) * f; ey = p[k - 1] + (p[k + 1] - p[k - 1]) * f; c.lineTo(ex, ey); break; }
  }
  c.stroke(); return [ex, ey];
}
function commitTo(n) {                              // lay strokes [committed, n) on the painting
  const L = layer;
  for (; L.committed < n; L.committed++) {
    const s = L.strokes[L.committed];
    const e = drawStroke(ctx, s, L.b);
    curX = e[0]; curY = e[1]; curHex = s.hex; count++;
  }
}
function renderLayer() {
  const L = layer;
  wctx.clearRect(0, 0, W, H);
  if (!L.n) return;
  const idx = Math.min(L.n, Math.floor(L.t / L.slot + 1e-9));
  commitTo(idx);
  if (idx >= L.n || L.slot < 0.012) return;         // small strokes: no travel, many per frame
  const s = L.strokes[idx], f = (L.t - idx * L.slot) / L.slot, travel = 0.38;
  const px = curX, py = curY;
  if (f < travel) {                                 // the cursor travels to the stroke
    const u = f / travel, e = u * u * (3 - 2 * u);
    L.px = px + (s.pts[0] - px) * e; L.py = py + (s.pts[1] - py) * e; L.wetHex = null;
  } else {                                          // then draws along it
    const e = drawStroke(wctx, s, L.b, s.len * (f - travel) / (1 - travel));
    L.px = e[0]; L.py = e[1]; L.wetHex = s.hex;
  }
}

function advance(dt) {
  let left = dt;
  while (left > 1e-9 && !done) {
    if (!layer) layer = planLayer(li);
    const use = Math.min(layer.dur - layer.t, left);
    layer.t += use; left -= use; T += use;
    layer.px = layer.py = undefined; layer.wetHex = null;
    if (layer.t >= layer.dur - 1e-9) {
      commitTo(layer.n); wctx.clearRect(0, 0, W, H);
      li++; layer = null;
      if (li >= SIZES.length) { done = true; wallMs = performance.now() - wall0; }
    } else renderLayer();
  }
  paintUI();
}
function finishNow() { while (!done) advance(1000); }

/* ---------- interface ---------- */
const sizeEls = [], passEls = [];
SIZES.forEach(s => { const e = document.createElement("li"); e.textContent = s; $("sizes").append(e); sizeEls.push(e); });
PASSES.forEach(p => { const e = document.createElement("li"); e.dataset.t = p; $("passes").append(e); passEls.push(e); });
function applyLang() {
  document.documentElement.lang = lang; document.title = t("app");
  nf = new Intl.NumberFormat(t("locale"));
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = t(e.dataset.t); });
  document.querySelectorAll("[data-title]").forEach(e => { e.title = t(e.dataset.title); });
  document.querySelectorAll("[data-aria]").forEach(e => { e.setAttribute("aria-label", t(e.dataset.aria)); });
  document.querySelectorAll("[data-alt]").forEach(e => { e.alt = t(e.dataset.alt); });
  $("lang").textContent = t("other"); $("lang").lang = t("otherLang");
  $("doc").textContent = photoName || t("none");
  if ($("err").dataset.on) $("err").textContent = t("badFile");
  if (savedNote) $("sheet-note").textContent = savedNote();
  paintUI();
}
function paintUI() {
  const has = !!refR, cur = done || !has ? -1 : li, pass = cur >> 1;
  sizeEls.forEach((e, k) => { e.classList.toggle("on", k === cur); if (k === cur) e.setAttribute("aria-current", "true"); else e.removeAttribute("aria-current"); });
  passEls.forEach((e, k) => { e.className = !has ? "" : done || k < pass ? "done" : k === pass ? "on" : ""; });
  const hex = layer && layer.wetHex || curHex;
  $("hex").textContent = hex; $("swatch").style.background = "#" + hex;
  $("count").textContent = t("strokes")(nf.format(count)) + (done ? t("finished") : "");
  for (const id of ["save", "restart", "s1", "s3", "send"]) $(id).disabled = !has;
  const pct = Math.min(100, T / TOTAL * 100);
  $("barfill").style.width = pct + "%"; $("bar").setAttribute("aria-valuenow", Math.round(pct));
  const c = $("cursor"), show = !done && (count > 0 || (layer && layer.px !== undefined));
  c.hidden = !show;
  if (show) {
    const x = layer && layer.px !== undefined ? layer.px : curX, y = layer && layer.px !== undefined ? layer.py : curY;
    const k = cv.clientWidth / W;
    c.style.transform = "translate(" + (x * k).toFixed(2) + "px," + (y * k).toFixed(2) + "px)";
  }
  $("pause").textContent = running || done ? t("pause") : t("resume");
  $("pause").disabled = done || !has;
}
function fit() { $("zoom").textContent = Math.round(cv.clientWidth / W * 100) + "%"; paintUI(); }
new ResizeObserver(fit).observe($("easel"));

function reset() {
  if (!refR) return;
  rng = mulberry32(SEED); li = 0; layer = null; T = 0; count = 0; done = false; running = true;
  curX = W / 2; curY = 0; curHex = PAPER.slice(1); timeline = []; wall0 = performance.now(); wallMs = 0;
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H); wctx.clearRect(0, 0, W, H);
  if (reduced) finishNow();
  paintUI();
}
function usePhoto(img, name) {
  photoName = (name || "").replace(/\.[^.]*$/, "").trim();
  $("doc").textContent = photoName || t("none");
  $("drop").hidden = true; $("ref").hidden = false; $("refph").hidden = true;
  $("err").textContent = ""; delete $("err").dataset.on;
  const k = LONG / Math.max(img.naturalWidth, img.naturalHeight);
  W = Math.max(1, Math.round(img.naturalWidth * k)); H = Math.max(1, Math.round(img.naturalHeight * k));
  cv.width = wet.width = W; cv.height = wet.height = H;
  document.documentElement.style.setProperty("--ar", W / H);
  $("dims").textContent = W + " × " + H + " px";
  const o = document.createElement("canvas"); o.width = W; o.height = H;
  const oc = o.getContext("2d"); oc.imageSmoothingQuality = "high"; oc.drawImage(img, 0, 0, W, H);
  const d = oc.getImageData(0, 0, W, H).data, n = W * H;
  refR = new Float32Array(n); refG = new Float32Array(n); refB = new Float32Array(n);
  for (let p = 0, q = 0; p < n; p++, q += 4) { refR[p] = d[q]; refG[p] = d[q + 1]; refB[p] = d[q + 2]; }
  $("ref").src = img.src;
  reset(); fit();
}
function loadPhoto(src, name) {
  return new Promise((ok, no) => { const im = new Image(); im.onload = () => { usePhoto(im, name); ok(); }; im.onerror = no; im.src = src; });
}
function badFile() {                                // shown on the drop box, or as an alert once a photo is up
  if ($("drop").hidden) { alert(t("badFile")); return; }
  $("err").textContent = t("badFile"); $("err").dataset.on = "1";
}
function loadFile(f) {
  if (!f) return;
  const r = new FileReader();
  r.onload = () => loadPhoto(r.result, f.name).catch(badFile);
  r.onerror = badFile;
  r.readAsDataURL(f);
}

function setSpeed(v) { speed = v; $("s1").setAttribute("aria-pressed", v === 1); $("s3").setAttribute("aria-pressed", v === 3); }
function togglePause() { if (!done) { running = !running; paintUI(); } }
function savePng() {
  if (!refR) return;
  const wasDone = done;
  cv.toBlob(blob => {
    const url = URL.createObjectURL(blob), name = (photoName ? photoName + "-" : "") + t("fileTail") + ".png";
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
    $("sheet-img").src = url;
    savedNote = () => name + " · " + W + " × " + H + " px" + (wasDone ? "" : t("still"));
    $("sheet-note").textContent = savedNote();
    if (!$("sheet").open) $("sheet").showModal();
  }, "image/png");
}
$("save").onclick = savePng;
$("lang").onclick = () => { lang = t("otherLang"); try { localStorage.setItem("painter.lang", lang); } catch (e) {} applyLang(); };
$("pick").onclick = () => $("file").click();
$("sheet-close").onclick = () => $("sheet").close();
$("pause").onclick = togglePause;
$("restart").onclick = reset;
$("s1").onclick = () => setSpeed(1);
$("s3").onclick = () => setSpeed(3);
$("send").onclick = finishNow;
$("change").onclick = () => $("file").click();
$("file").onchange = e => { loadFile(e.target.files[0]); e.target.value = ""; };
// A photo can also be dropped anywhere on the page or pasted from the clipboard.
let dragDepth = 0;
const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files");
addEventListener("dragenter", e => { if (hasFiles(e)) { e.preventDefault(); dragDepth++; document.body.classList.add("over"); } });
addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
addEventListener("dragleave", e => { if (hasFiles(e) && --dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("over"); } });
addEventListener("drop", e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; document.body.classList.remove("over");
  loadFile(e.dataTransfer.files[0]);
});
addEventListener("paste", e => {
  const f = Array.from(e.clipboardData ? e.clipboardData.files : []).find(x => x.type.startsWith("image/"));
  if (f) { e.preventDefault(); loadFile(f); }
});
addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || $("sheet").open) return;
  const k = e.key.toLowerCase();
  if (k === "o") { $("file").click(); return; }
  if (!refR) return;
  if (k === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); togglePause(); }
  else if (k === "r") reset(); else if (k === "1") setSpeed(1); else if (k === "3") setSpeed(3);
  else if (k === "e") finishNow(); else if (k === "s") savePng();
});

/* ---------- clock ---------- */
let lastNow = 0;
function tick(now) {
  const dt = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
  if (!manual && running && !done && refR) advance(dt * speed);
  requestAnimationFrame(tick);
}
// Blank paper until a photo arrives.
cv.width = wet.width = W; cv.height = wet.height = H;
ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
li = 0; layer = null; T = 0; count = 0; done = false;
applyLang();

// For scripted use and frame-exact recording: __paint.load(url, name), and with ?manual, __paint.step(seconds).
window.__paint = {
  load: (src, name) => loadPhoto(src, name),
  step: dt => { if (refR) advance(dt); },
  state: () => ({photo: !!refR, t: T, total: TOTAL, strokes: count, done, size: done || !refR ? null : SIZES[li], wallMs, w: W, h: H, lang}),
  timeline: () => timeline,
  ready: document.fonts.ready.then(() => { lastNow = performance.now(); requestAnimationFrame(tick); })
};
</script>
</body>
